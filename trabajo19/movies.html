<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peliculas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style type="text/css">
        body {
            margin: 0px;
            padding: 0px;
            background-color: rgb(31, 84, 131);
            color: #ffffff;
        }

        h1 {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 36px;
            color: #ffffff;
        }

        #main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            justify-content: center;
            align-items: flex;
            min-height: 100vh;
            background-color: rgb(31, 84, 131);
        }

        .card {
            background-color: rgb(68, 148, 219);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px #444b6e8a;
            text-align: center;
            margin: 10px;
            font-family: 'Montserrat', sans-serif;
        }

        img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Películas</h1>
    <div id="main">
        <div class="card" v-for="movie in movies" :key="movie.id" @click="viewMovie(movie)">
            <img :src="'https://www.themoviedb.org/t/p/w600_and_h900_bestv2/' + movie.poster_path" alt="movie poster">
            <h2>{{ movie.title }}</h2>
            <p><strong>Lanzamiento:</strong><br> {{ movie.release_date }}</p>
            <p>{{ movie.overview }}</p>
            <p><strong>Lenguaje original:</strong> {{ movie.original_language }}</p>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            data() {
                return {
                    movies: [],
                    viewport: 'movies'
                }
            },
            methods: {
                getMovies() {
                    fetch('https://api.themoviedb.org/3/discover/movie?api_key=13c164db7b0cbbc91a51acf2fcc65f79')
                        .then(response => response.json())
                        .then(data => {
                            console.log(data)
                            this.movies = data.results;
                        })
                        .catch(error => {
                            console.log("Error: " + error)
                        })
                },
                viewMovie(movie) {
                    console.log(movie);
                    const movieId = movie.id;
                    window.location.href = window.location.href = `movie.html?id=${movieId}`
                }
            },
            mounted() {
                console.log('App mounted')
                this.getMovies();
            }
        }).mount('#main')
    </script>
</body>

</html>
